<div class="container">
	<h2 mat-dialog-title>{{ data.title }}</h2>
	
	<mat-dialog-content>
		<p><b>{{ data.message }}</b></p>
	</mat-dialog-content>
	
	<mat-dialog-actions align="end">
		<button class="cancel-btn" #cancelBtn mat-button (click)="dialogRef.close(false)">
			{{ data.cancelText || 'Cancel' }}
		</button>
		<button class="delete-btn" mat-raised-button color="warn" (click)="dialogRef.close(true)">
			{{ data.confirmText || 'Confirm' }}
		</button>
	</mat-dialog-actions>
</div>
