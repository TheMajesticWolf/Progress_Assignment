<div class="error-page">
	
	<div class="info-box">

		<div class="table-box">
			<table border="1">
				<thead>
					<tr>
						<th>Status code</th>
						<th>Status text</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>{{code}}</td>
						<td>{{statusText}}</td>
					</tr>
				</tbody>
			</table>

		</div>

		<div class="message-box">
			<h3>Error</h3>
			<h5>{{message}}</h5>
		</div>


	</div>	


	
</div>
