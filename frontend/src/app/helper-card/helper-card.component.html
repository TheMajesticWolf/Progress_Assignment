<div class="helper-card" (click)="emitSelectEvent()" [class.selected]="isSelectedHelper">

	<div class="photo-box">
		@if(helper.photoUrl.length !== 0) {
			<img [src]="BACKEND + helper.photoUrl" alt="Logo" width="50px" height="50px">
		}
		@else {
			<img src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Logo" width="50px" height="50px">
		}
	</div>

	<div class="info-box">
		<h5>{{helper.fullName}}</h5>
		<span>{{helper.typeOfService}}</span>
	</div>

	<div class="household-num-box">
		<span> -1 Households</span>
	</div>

</div>
