<h1 mat-dialog-title>{{data.dialogTitle || "QR Code"}}</h1>
<div mat-dialog-content>
	<qrcode #qrCodeElement [qrdata]="data.qrData" [width]="256" errorCorrectionLevel="M"></qrcode>
</div>
<div mat-dialog-actions>
	<button mat-button mat-dialog-close>Close</button>
	<button mat-button (click)="downloadQRCode(qrCodeElement)">Download</button>
</div>
